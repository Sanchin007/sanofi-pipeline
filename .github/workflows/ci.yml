name: dbt Continuous Integration & Daily Orchestration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'     # Runs automatically every day at 02:00 AM UTC

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dbt-core>=1.8.0,<1.9.0" "dbt-duckdb>=1.8.0,<1.9.0"
      - run: dbt run
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
      - run: dbt test
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dbt-core>=1.8.0,<1.9.0" "dbt-snowflake>=1.8.0,<1.9.0"
      - run: dbt run --target prod
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      - run: dbt docs generate --target prod
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dbt_project/target
      - id: deployment
        uses: actions/deploy-pages@v4